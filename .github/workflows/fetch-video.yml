name: fetch-video
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          pipx install yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
      - name: Download video
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          yt-dlp --remote-components ejs:github -f "bv*[height<=720]+ba/b[height<=720]/b" --merge-output-format mp4 -o source.mp4 "https://www.youtube.com/watch?v=FI4XhThSkWo"
          ls -la source.mp4
      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "fetch-FI4XhThSkWo" source.mp4 --repo "$GITHUB_REPOSITORY" --title "fetch FI4XhThSkWo" --notes "yt-dlp via GitHub Actions"
